<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOR - Tracker Kesehatan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- ================= LAYAR LOGIN ================= -->
    <div id="login-view" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">THOR</h2>
        <p class="text-gray-500 mb-6">Tracker Kesehatan IDEP</p>
        <button onclick="loginDenganGoogle()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
            Login dengan Google
        </button>
    </div>

    <!-- ================= LAYAR DASHBOARD ================= -->
    <div id="dashboard-view" class="hidden bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden">
        
        <div class="bg-blue-600 p-5 text-white flex justify-between items-center">
            <div>
                <p class="text-sm opacity-80">Halo,</p>
                <p id="user-name" class="font-bold text-lg">Nama User</p>
            </div>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-xs py-2 px-3 rounded-md font-bold transition">
                Logout
            </button>
        </div>

        <div class="p-6 text-center">
            <h3 class="text-gray-600 font-semibold mb-2">Sisa Kalori Harian</h3>
            <div class="relative w-48 h-48 mx-auto">
                <canvas id="calorieChart"></canvas>
                <div class="absolute inset-0 flex flex-col items-center justify-center mt-10">
                    <span id="sisa-kalori" class="text-3xl font-bold text-gray-800">1200</span>
                    <span class="text-xs text-gray-500">kcal</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 border-t border-gray-100 p-4 text-center">
            <div class="bg-blue-50 rounded-lg p-2">
                <p class="text-xs text-gray-500">Air</p>
                <p class="font-bold text-blue-600 text-sm">1.5L</p>
            </div>
            <div class="bg-red-50 rounded-lg p-2">
                <p class="text-xs text-gray-500">Protein</p>
                <p class="font-bold text-red-600 text-sm">45g</p>
            </div>
            <div class="bg-yellow-50 rounded-lg p-2">
                <p class="text-xs text-gray-500">Karbo</p>
                <p class="font-bold text-yellow-600 text-sm">150g</p>
            </div>
            <div class="bg-green-50 rounded-lg p-2">
                <p class="text-xs text-gray-500">Lemak</p>
                <p class="font-bold text-green-600 text-sm">30g</p>
            </div>
        </div>

        <!-- Tombol Aksi Cepat dengan fungsi onClick terpasang -->
        <div class="p-4 grid grid-cols-3 gap-2 border-t border-gray-100">
            <button class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center gap-1 transition">
                <span>🍽️</span> Makan
            </button>
            
            <!-- Tombol Minum kini memanggil fungsi addWater(250) saat diklik -->
            <button onclick="addWater(250)" class="bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center gap-1 transition">
                <span>💧</span> Minum (+250ml)
            </button>
            
            <button class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center gap-1 transition">
                <span>🏃</span> Olahraga
            </button>
        </div>
    </div>

    <!-- Script library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // --- 1. INISIALISASI SUPABASE ---
        // Catatan: Hapus bagian '/rest/v1/' dari URL karena supabase-js v2 sudah menangani itu
        const supabaseUrl = 'https://cvzjnrnnegdqoyuzkwhq.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2empucm5uZWdkcW95dXprd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTI4OTIsImV4cCI6MjEwNjA4ODg5Mn0.94FH2z2hhAdxF_1SNoqyhPtuWj8NHtHKzJXN9JgTais'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let myChart = null;
        let currentUser = null; // Menyimpan data pengguna aktif

        // --- 2. FUNGSI AUTENTIKASI ---
        async function loginDenganGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: 'https://ngurahpagan1989-ui.github.io/THOR/'
                }
            });
            if (error) alert("Gagal login: " + error.message);
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            cekSesi();
        }

        // --- 3. FUNGSI LOGIKA APLIKASI (Tambahan dari app.js) ---
        // Fungsi untuk mencatat asupan air
        async function addWater(amount) {
            if (!currentUser) {
                alert('Silakan login terlebih dahulu!');
                return;
            }

            // Gunakan insert seperti pada app.js, namun ambil user_id daricurrentUser
            const { data, error } = await supabaseClient
                .from('water_logs')
                .insert([
                    { user_id: currentUser.id, amount_ml: amount } 
                ]);
                
            if (error) {
                console.error('Gagal mencatat air:', error);
                alert(`Gagal menambah data! Pesan: ${error.message}`);
            } else {
                alert(`Berhasil menambah ${amount}ml air!`);
            }
        }

        // --- 4. FUNGSI RENDER GRAFIK SPIDOMETER ---
        function renderGrafik(kaloriMasuk, targetKalori) {
            const ctx = document.getElementById('calorieChart').getContext('2d');
            const sisaKalori = targetKalori - kaloriMasuk;
            
            if (myChart != null) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Terpakai', 'Sisa'],
                    datasets: [{
                        data: [kaloriMasuk, sisaKalori > 0 ? sisaKalori : 0],
                        backgroundColor: ['#3b82f6', '#e5e7eb'], 
                        borderWidth: 0,
                        cutout: '75%',
                        circumference: 180,
                        rotation: 270      
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: true }
                    }
                }
            });

            document.getElementById('sisa-kalori').innerText = sisaKalori > 0 ? sisaKalori : 0;
        }

        // --- 5. PENGECEKAN SESI & UI ---
        async function cekSesi() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            const loginView = document.getElementById('login-view');
            const dashboardView = document.getElementById('dashboard-view');

            if (session) {
                // Simpan profil pengguna untuk digunakan di fungsi addWater
                currentUser = session.user;
                
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                
                document.getElementById('user-name').innerText = session.user.user_metadata.full_name.split(" ")[0]; 
                
                renderGrafik(800, 2000); 

            } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        }

        window.onload = cekSesi;
    </script>
</body>
</html>
