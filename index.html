<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOR - Tracker Kesehatan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <!-- ================= LAYAR LOGIN ================= -->
    <div id="login-view" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">THOR</h2>
        <p class="text-gray-500 mb-6">Tracker Kesehatan Mandiri</p>
        <button onclick="loginDenganGoogle()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
            Login dengan Google
        </button>
    </div>

    <!-- ================= LAYAR DASHBOARD ================= -->
    <div id="dashboard-view" class="hidden bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden relative">
        
        <!-- Header -->
        <div class="bg-blue-600 p-5 text-white flex justify-between items-center">
            <div>
                <p class="text-sm opacity-80">Halo,</p>
                <p id="user-name" class="font-bold text-lg">Nama User</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="aturApiKey()" title="Atur Gemini API Key" class="bg-blue-700 hover:bg-blue-800 text-xs py-2 px-2.5 rounded-md font-bold transition">
                    ⚙️ Key
                </button>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-xs py-2 px-3 rounded-md font-bold transition">
                    Logout
                </button>
            </div>
        </div>

        <!-- Area Grafik -->
        <div class="p-6 text-center">
            <h3 class="text-gray-600 font-semibold mb-2">Sisa Kalori Harian</h3>
            <div class="relative w-48 h-48 mx-auto">
                <canvas id="calorieChart"></canvas>
                <div class="absolute inset-0 flex flex-col items-center justify-center mt-10">
                    <span id="sisa-kalori" class="text-4xl font-bold text-gray-800">0</span>
                    <span class="text-xs text-gray-500 font-medium">kcal</span>
                </div>
            </div>
        </div>

        <!-- Area Makro -->
        <div class="grid grid-cols-4 gap-2 border-t border-gray-100 p-4 text-center">
            <div class="bg-blue-50 rounded-lg p-2">
                <p class="text-xs text-gray-500">Air</p>
                <p id="water-val" class="font-bold text-blue-600 text-sm">0 L</p>
            </div>
            <div class="bg-red-50 rounded-lg p-2">
                <p class="text-xs text-gray-500">Pro</p>
                <p id="protein-val" class="font-bold text-red-600 text-sm">0 g</p>
            </div>
            <div class="bg-yellow-50 rounded-lg p-2">
                <p class="text-xs text-gray-500">Karb</p>
                <p id="carbo-val" class="font-bold text-yellow-600 text-sm">0 g</p>
            </div>
            <div class="bg-green-50 rounded-lg p-2">
                <p class="text-xs text-gray-500">Lem</p>
                <p id="fat-val" class="font-bold text-green-600 text-sm">0 g</p>
            </div>
        </div>

        <!-- Input Kamera Tersembunyi (Langsung buka kamera di HP) -->
        <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="prosesFotoMakanan(event)">

        <!-- Tombol Aksi Cepat (4 Kolom Utama) -->
        <div class="p-4 grid grid-cols-4 gap-2 border-t border-gray-100">
            <button onclick="bukaKamera()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center gap-1 transition shadow-sm">
                <span class="text-lg">📸</span> Scan AI
            </button>
            <button onclick="bukaModal('modal-makan')" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center gap-1 transition">
                <span class="text-lg">🍽️</span> Makan
            </button>
            <button onclick="bukaModal('modal-minum')" class="bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center gap-1 transition">
                <span class="text-lg">💧</span> Minum
            </button>
            <button onclick="bukaModal('modal-olahraga')" class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold py-3 rounded-lg flex flex-col items-center gap-1 transition">
                <span class="text-lg">🏃</span> Olahraga
            </button>
        </div>

        <!-- Riwayat Hari Ini -->
        <div class="bg-gray-50 p-4 border-t border-gray-200">
            <h4 class="text-xs font-bold text-gray-500 mb-3 uppercase tracking-wider">Riwayat Hari Ini</h4>
            <ul id="history-list" class="space-y-2 text-sm max-h-40 overflow-y-auto">
                <li class="text-gray-400 text-center italic text-xs py-2">Belum ada aktivitas hari ini.</li>
            </ul>
        </div>
    </div>

    <!-- ================= MODAL LOADING / PROSES AI ================= -->
    <div id="modal-loading" class="hidden fixed inset-0 bg-black bg-opacity-60 flex flex-col items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 text-center shadow-2xl max-w-xs w-full flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="font-bold text-gray-800 text-base">Gemini Menganalisis...</p>
            <p class="text-xs text-gray-500 mt-1">Memperkirakan kalori & makro dari foto</p>
        </div>
    </div>

    <!-- ================= MODAL CATAT MAKAN MANUAL ================= -->
    <div id="modal-makan" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4">Catat Makanan 🍽️</h3>
            <input id="input-makanan" type="text" placeholder="Nama makanan (Mendoan, Nasi Goreng)" class="w-full border rounded-lg p-3 mb-3 bg-gray-50">
            <input id="input-kalori" type="number" placeholder="Perkiraan Kalori (kcal)" class="w-full border rounded-lg p-3 mb-4 bg-gray-50">
            <div class="flex gap-2">
                <button onclick="tutupModal('modal-makan')" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 rounded-lg">Batal</button>
                <button onclick="simpanMakan()" class="w-1/2 bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 rounded-lg">Simpan</button>
            </div>
        </div>
    </div>

    <!-- ================= MODAL MINUM ================= -->
    <div id="modal-minum" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4">Catat Minum 💧</h3>
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="simpanMinum(250)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-3 rounded-lg border border-blue-200">Gelas (250ml)</button>
                <button onclick="simpanMinum(600)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-3 rounded-lg border border-blue-200">Botol (600ml)</button>
            </div>
            <button onclick="tutupModal('modal-minum')" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 rounded-lg">Batal</button>
        </div>
    </div>

    <!-- ================= MODAL OLAHRAGA ================= -->
    <div id="modal-olahraga" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-sm">
            <h3 class="font-bold text-lg mb-4">Catat Olahraga 🏃</h3>
            <input id="input-olahraga" type="text" placeholder="Jenis olahraga (Lari, Gym)" class="w-full border rounded-lg p-3 mb-3 bg-gray-50">
            <input id="input-bakar" type="number" placeholder="Kalori terbakar (kcal)" class="w-full border rounded-lg p-3 mb-4 bg-gray-50">
            <div class="flex gap-2">
                <button onclick="tutupModal('modal-olahraga')" class="w-1/2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 rounded-lg">Batal</button>
                <button onclick="simpanOlahraga()" class="w-1/2 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-lg">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Script library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // --- 1. INISIALISASI SUPABASE ---
        const supabaseUrl = 'https://cvzjnrnnegdqoyuzkwhq.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2empucm5uZWdkcW95dXprd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTI4OTIsImV4cCI6MjEwNjA4ODg5Mn0.94FH2z2hhAdxF_1SNoqyhPtuWj8NHtHKzJXN9JgTais'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let myChart = null;
        let currentUser = null; 
        const TARGET_KALORI = 2000; 

        // --- 2. MANAJEMEN GEMINI API KEY DI LOCALSTORAGE ---
        function ambilApiKey() {
            let key = localStorage.getItem("THOR_GEMINI_KEY");
            if (!key) {
                key = prompt("Masukkan Gemini API Key Anda untuk mengaktifkan AI Vision:");
                if (key && key.trim() !== "") {
                    localStorage.setItem("THOR_GEMINI_KEY", key.trim());
                }
            }
            return key;
        }

        function aturApiKey() {
            const current = localStorage.getItem("THOR_GEMINI_KEY") || "";
            const baru = prompt("Ubah atau perbarui Gemini API Key:", current);
            if (baru !== null && baru.trim() !== "") {
                localStorage.setItem("THOR_GEMINI_KEY", baru.trim());
                alert("Gemini API Key berhasil disimpan di perangkat ini!");
            }
        }

        // --- 3. KONTROL KAMERA & AI VISION ---
        function bukaKamera() {
            const key = ambilApiKey();
            if (!key) {
                alert("API Key diperlukan untuk memproses foto.");
                return;
            }
            document.getElementById('camera-input').click();
        }

        async function prosesFotoMakanan(event) {
            const file = event.target.files[0];
            if (!file) return;

            const apiKey = ambilApiKey();
            if (!apiKey) return;

            bukaModal('modal-loading');

            try {
                const base64Data = await resizeDanKonversiBase64(file);

                const prompt = "Kamu adalah nutrisionis ahli. Analisis foto ini (makanan, minuman, atau kemasan berlabel). " +
                               "Perkirakan nama item, total kalori (kcal), protein (g), karbohidrat (g), dan lemak (g). " +
                               "WAJIB keluarkan HANYA JSON murni tanpa markdown: " +
                               '{"food_name": "Nama Item", "calories": 250, "protein_g": 10, "carbs_g": 30, "fat_g": 5}';

                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                            ]
                        }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const resJson = await response.json();
                if (resJson.error) throw new Error(resJson.error.message || "Gagal dari API Gemini");

                const rawText = resJson.candidates[0].content.parts[0].text;
                const aiData = JSON.parse(rawText.replace(/```json/g, "").replace(/```/g, "").trim());

                // Simpan langsung ke database Supabase
                const { error: dbError } = await supabaseClient.from('food_logs').insert([{
                    user_id: currentUser.id,
                    food_name: aiData.food_name || "Makanan Terdeteksi",
                    calories: Number(aiData.calories) || 0,
                    protein_g: Number(aiData.protein_g) || 0,
                    carbs_g: Number(aiData.carbs_g) || 0,
                    fat_g: Number(aiData.fat_g) || 0
                }]);

                if (dbError) throw dbError;

                alert(`✅ Makanan Tercatat!\n🍽️ ${aiData.food_name}\n🔥 ${aiData.calories} kcal`);
                loadDataHariIni();

            } catch (err) {
                alert("Gagal memproses foto: " + err.message);
            } finally {
                tutupModal('modal-loading');
                event.target.value = '';
            }
        }

        // Kompres foto ke resolusi max 800px agar respons cepat
        function resizeDanKonversiBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (readerEvent) => {
                    const img = new Image();
                    img.src = readerEvent.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxDim = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > maxDim) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else if (height > maxDim) {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        resolve(dataUrl.split(',')[1]);
                    };
                    img.onerror = (e) => reject(e);
                };
                reader.onerror = (e) => reject(e);
            });
        }

        // --- 4. AUTENTIKASI ---
        async function loginDenganGoogle() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: 'https://ngurahpagan1989-ui.github.io/THOR/' }
            });
            if (error) alert("Gagal login: " + error.message);
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            cekSesi();
        }

        // --- 5. MODAL KONTROL ---
        function bukaModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function tutupModal(id) { document.getElementById(id).classList.add('hidden'); }

        // --- 6. SIMPAN DATA MANUAL ---
        async function simpanMakan() {
            const nama = document.getElementById('input-makanan').value;
            const kalori = document.getElementById('input-kalori').value;
            
            if (!nama || !kalori) return alert("Mohon isi nama makanan dan kalori!");

            const { error } = await supabaseClient.from('food_logs').insert([{ 
                user_id: currentUser.id, food_name: nama, calories: parseInt(kalori) 
            }]);
                
            if (error) alert(`Gagal: ${error.message}`);
            else {
                document.getElementById('input-makanan').value = '';
                document.getElementById('input-kalori').value = '';
                tutupModal('modal-makan');
                loadDataHariIni(); 
            }
        }

        async function simpanMinum(jumlah) {
            const { error } = await supabaseClient.from('water_logs').insert([{ 
                user_id: currentUser.id, amount_ml: jumlah 
            }]);
            
            if (error) alert(`Gagal: ${error.message}`);
            else {
                tutupModal('modal-minum');
                loadDataHariIni(); 
            }
        }

        async function simpanOlahraga() {
            const nama = document.getElementById('input-olahraga').value;
            const kalori = document.getElementById('input-bakar').value;
            
            if (!nama || !kalori) return alert("Mohon isi olahraga dan kalori!");

            const { error } = await supabaseClient.from('exercise_logs').insert([{ 
                user_id: currentUser.id, exercise_name: nama, calories_burned: parseInt(kalori), duration_minutes: 30 
            }]);
                
            if (error) alert(`Gagal: ${error.message}`);
            else {
                document.getElementById('input-olahraga').value = '';
                document.getElementById('input-bakar').value = '';
                tutupModal('modal-olahraga');
                loadDataHariIni(); 
            }
        }

        // --- 7. LOAD DATA HARIAN ---
        async function loadDataHariIni() {
            if (!currentUser) return;
            
            const today = new Date().toISOString().split('T')[0];
            const startOfDay = `${today}T00:00:00.000Z`;
            const endOfDay = `${today}T23:59:59.999Z`;

            const [reqAir, reqMakan, reqOlahraga] = await Promise.all([
                supabaseClient.from('water_logs').select('*').eq('user_id', currentUser.id).gte('logged_at', startOfDay).lte('logged_at', endOfDay),
                supabaseClient.from('food_logs').select('*').eq('user_id', currentUser.id).gte('logged_at', startOfDay).lte('logged_at', endOfDay),
                supabaseClient.from('exercise_logs').select('*').eq('user_id', currentUser.id).gte('logged_at', startOfDay).lte('logged_at', endOfDay)
            ]);

            let totalWater = 0, totalCalIn = 0, totalPro = 0, totalCarb = 0, totalFat = 0;
            let riwayatGabungan = [];

            if (reqAir.data) reqAir.data.forEach(w => {
                totalWater += w.amount_ml;
                riwayatGabungan.push({ waktu: w.logged_at, teks: `💧 Minum Air (+${w.amount_ml}ml)`, warna: 'text-blue-600' });
            });

            if (reqMakan.data) reqMakan.data.forEach(f => {
                totalCalIn += Number(f.calories);
                totalPro += Number(f.protein_g);
                totalCarb += Number(f.carbs_g);
                totalFat += Number(f.fat_g);
                riwayatGabungan.push({ waktu: f.logged_at, teks: `🍽️ ${f.food_name} (+${f.calories} kcal)`, warna: 'text-gray-800' });
            });

            if (reqOlahraga.data) reqOlahraga.data.forEach(e => {
                riwayatGabungan.push({ waktu: e.logged_at, teks: `🏃 ${e.exercise_name} (-${e.calories_burned} kcal)`, warna: 'text-orange-600' });
            });

            document.getElementById('water-val').innerText = (totalWater / 1000).toFixed(1) + ' L';
            document.getElementById('protein-val').innerText = totalPro + ' g';
            document.getElementById('carbo-val').innerText = totalCarb + ' g';
            document.getElementById('fat-val').innerText = totalFat + ' g';

            renderGrafik(totalCalIn, TARGET_KALORI);

            const ulRiwayat = document.getElementById('history-list');
            ulRiwayat.innerHTML = '';
            
            if (riwayatGabungan.length === 0) {
                ulRiwayat.innerHTML = `<li class="text-gray-400 text-center italic text-xs py-2">Belum ada aktivitas hari ini.</li>`;
            } else {
                riwayatGabungan.sort((a, b) => new Date(b.waktu) - new Date(a.waktu));
                riwayatGabungan.forEach(item => {
                    const jam = new Date(item.waktu).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    ulRiwayat.innerHTML += `
                        <li class="flex justify-between items-center bg-white p-2 rounded border border-gray-100 shadow-sm">
                            <span class="${item.warna} font-medium">${item.teks}</span>
                            <span class="text-xs text-gray-400">${jam}</span>
                        </li>
                    `;
                });
            }
        }

        // --- 8. GRAFIK SPIDOMETER ---
        function renderGrafik(kaloriMasuk, targetKalori) {
            const ctx = document.getElementById('calorieChart').getContext('2d');
            const sisaKalori = targetKalori - kaloriMasuk;
            
            if (myChart != null) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Terpakai', 'Sisa'],
                    datasets: [{
                        data: [kaloriMasuk, sisaKalori > 0 ? sisaKalori : 0],
                        backgroundColor: ['#3b82f6', '#e5e7eb'], 
                        borderWidth: 0,
                        cutout: '75%',
                        circumference: 180,
                        rotation: 270      
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: true } }
                }
            });

            document.getElementById('sisa-kalori').innerText = sisaKalori > 0 ? sisaKalori : 0;
        }

        // --- 9. PENGECEKAN SESI ---
        async function cekSesi() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const loginView = document.getElementById('login-view');
            const dashboardView = document.getElementById('dashboard-view');

            if (session) {
                currentUser = session.user;
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                document.getElementById('user-name').innerText = session.user.user_metadata.full_name ? session.user.user_metadata.full_name.split(" ")[0] : 'User'; 
                loadDataHariIni(); 
            } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        }

        window.onload = cekSesi;
    </script>
</body>
</html>
