<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOR - Tracker Kesehatan</title>
    <!-- Tambahan sedikit CSS agar tampilannya rapi -->
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; display: flex; justify-content: center;}
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        button { padding: 10px 20px; margin: 10px 0; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%;}
        #btn-login { background-color: #4285F4; color: white; }
        #btn-login:hover { background-color: #357ae8; }
        #btn-logout { background-color: #e53935; color: white; }
        #btn-logout:hover { background-color: #c62828; }
        #user-info { margin-top: 20px; display: none; background: #e3f2fd; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Aplikasi THOR</h2>
        <p id="status-text">Silakan login untuk mulai mencatat asupan dan targetmu hari ini.</p>
        
        <!-- Tombol Login & Logout -->
        <button id="btn-login" onclick="loginDenganGoogle()">Login dengan Google</button>
        <button id="btn-logout" onclick="logout()" style="display: none;">Logout</button>

        <!-- Area untuk menampilkan profil Google setelah berhasil login -->
        <div id="user-info">
            <p>Selamat datang, <br><strong id="user-name" style="font-size: 20px;"></strong>!</p>
            <p>Email: <span id="user-email"></span></p>
        </div>
    </div>

    <!-- Script library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // 1. Inisialisasi Koneksi ke Supabase
        const supabaseUrl = 'https://cvzjnrnnegdqoyuzkwhq.supabase.co'; 
        
        // GANTI INI: Masukkan kunci 'anon / public' dari pengaturan API Supabase-mu
        const supabaseKey = 'MASUKKAN_ANON_KEY_PUBLIC_DISINI'; 
        
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Fungsi Login dengan Google
        async function loginDenganGoogle() {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    // Pastikan URL ini sama persis dengan URL Live Server kamu!
                    redirectTo: 'http://127.0.0.1:5500/index.html' 
                }
            });
            
            if (error) {
                alert("Gagal login: " + error.message);
                console.error(error);
            }
        }

        // 3. Fungsi Logout
        async function logout() {
            const { error } = await supabaseClient.auth.signOut();
            if (error) {
                alert("Gagal logout: " + error.message);
            } else {
                cekSesi(); // Perbarui tampilan setelah logout berhasil
            }
        }

        // 4. Fungsi Mengecek Status User (Sudah login atau belum?)
        async function cekSesi() {
            // Tarik data sesi dari Supabase
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            // Ambil elemen HTML yang ingin kita ubah
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');
            const userInfo = document.getElementById('user-info');
            const statusText = document.getElementById('status-text');

            if (session) {
                // JIKA SUDAH LOGIN:
                btnLogin.style.display = 'none';           // Sembunyikan tombol login
                btnLogout.style.display = 'block';         // Munculkan tombol logout
                userInfo.style.display = 'block';          // Munculkan area profil
                statusText.style.display = 'none';         // Sembunyikan teks sambutan awal
                
                // Tampilkan nama dan email dari Google
                document.getElementById('user-name').innerText = session.user.user_metadata.full_name;
                document.getElementById('user-email').innerText = session.user.email;
            } else {
                // JIKA BELUM LOGIN / SUDAH LOGOUT:
                btnLogin.style.display = 'block';
                btnLogout.style.display = 'none';
                userInfo.style.display = 'none';
                statusText.style.display = 'block';
            }
        }

        // Jalankan pengecekan otomatis setiap kali halaman web dibuka atau di-refresh
        window.onload = cekSesi;
    </script>
</body>
</html>
